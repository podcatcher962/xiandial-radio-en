<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XianDial &middot; Station List Builder</title>
<style>
:root{
  --bg:#1B1C1F; --card:#24262A; --card2:#2C2F34; --line:#3A3D43;
  --tx:#E6E4E1; --tx2:#A5A29D;
  --acc:#4A9EFF; --ok:#3FC08A; --warn:#E8A33D; --bad:#E2685F;
  --ui:100%; --tap:34px;
}
html[data-theme="light"]{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#E9EBEE; --line:#C8CCD2;
  --tx:#1D1F23; --tx2:#5E646C;
  --acc:#1668C4; --ok:#1E8A5F; --warn:#A96A12; --bad:#C0392B;
}
html[data-contrast="high"]{ --line:#8A8F98; --tx2:#6B7078; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--ui)/100)}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font:15px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}

/* ── 顶栏 ── */
#top{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px;
}
#brand{font-size:19px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
#brand small{display:block;font-size:11px;font-weight:400;color:var(--tx2);letter-spacing:.02em}
#top .sp{flex:1 1 auto}
#topSeg{display:flex;gap:6px;flex-wrap:wrap}
#topSeg button,.btn{
  min-height:var(--tap);padding:7px 13px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx);border-radius:8px;cursor:pointer;
  font:inherit;font-size:14px;transition:background .15s,border-color .15s;
}
#topSeg button:hover,.btn:hover{background:var(--line)}
#topSeg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{min-height:28px;padding:4px 10px;font-size:13px}

/* ── 导航 ── */
#nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
#nav button{
  min-height:var(--tap);padding:7px 14px;border:1px solid transparent;background:transparent;
  color:var(--tx2);border-radius:7px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap
}
#nav button:hover{color:var(--tx);background:var(--card2)}
#nav button.on{color:var(--acc);background:var(--card2);border-color:var(--line);font-weight:600}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--tx)}
.hint{color:var(--tx2);font-size:13px;margin:0 0 11px}

/* ── 拖放区 ── */
#drop{
  border:2px dashed var(--line);border-radius:11px;padding:26px 16px;text-align:center;
  cursor:pointer;background:var(--card2);transition:border-color .15s,background .15s
}
#drop.hot{border-color:var(--acc);background:var(--acc);color:#fff}
#drop .big{font-size:15px;font-weight:600;margin-bottom:5px}
#drop .sm2{font-size:13px;color:var(--tx2)}
#drop.hot .sm2{color:#dce9fb}

/* ── 表单 ── */
textarea{
  width:100%;min-height:150px;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);border-radius:9px;padding:10px;
  font:13px/1.6 Consolas,"Courier New",monospace;resize:vertical
}
input[type=text]{
  background:var(--bg);color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font:inherit;min-height:var(--tap);width:100%
}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:9px 0}
.row>label{color:var(--tx2);font-size:13px;white-space:nowrap}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;min-height:var(--tap)}
.chk input{width:17px;height:17px;accent-color:var(--acc);cursor:pointer}

/* ── chips ── */
.chips{display:grid;gap:7px;margin:8px 0}
.chips.c1{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.chips.c2{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.chip{
  padding:6px 9px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);
  border-radius:7px;cursor:pointer;font-size:13px;text-align:center;
  transition:background .15s,color .15s,border-color .15s
}
.chip:hover{border-color:var(--acc);color:var(--tx)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

/* ── 统计 ── */
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:11px 0}
.st{
  flex:1 1 104px;background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px
}
.st b{display:block;font-size:21px;line-height:1.25}
.st span{font-size:12px;color:var(--tx2)}
.st.ok b{color:var(--ok)} .st.warn b{color:var(--warn)} .st.bad b{color:var(--bad)}

/* ── 表格 ── */
#tblBox{border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:560px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);position:sticky;top:0;z-index:2;font-size:12px;color:var(--tx2);white-space:nowrap}
tr.err td{background:rgba(226,104,95,.13)}
td.nm{min-width:150px;max-width:260px;word-break:break-all}
td.u{min-width:210px;font:12px/1.5 Consolas,monospace;word-break:break-all}
td.s{white-space:nowrap}
.sel{
  background:var(--bg);color:var(--tx);border:1px solid var(--line);
  border-radius:6px;padding:3px 5px;font:inherit;font-size:12px;max-width:150px
}
.tag{font-size:11px;padding:2px 6px;border-radius:5px;display:inline-block}
.tag.h{background:var(--ok);color:#06281c}
.tag.x{background:var(--bad);color:#fff}
.tag.w{background:var(--warn);color:#2b1c00}
.empty{padding:26px;text-align:center;color:var(--tx2);font-size:14px}

/* ── 检查清单 ── */
#chkList{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
#chkList li{padding:5px 9px;border-radius:7px;margin-bottom:5px;display:flex;gap:8px;align-items:flex-start}
#chkList li.pass{background:rgba(63,192,138,.13);color:var(--ok)}
#chkList li.err{background:rgba(226,104,95,.14);color:var(--bad)}
#chkList li.warn{background:rgba(232,163,61,.14);color:var(--warn)}
#chkList code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}

pre{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;
  overflow:auto;max-height:420px;font:12px/1.6 Consolas,"Courier New",monospace;margin:9px 0
}
.doc h3{margin:16px 0 5px;font-size:15px;color:var(--acc)}
.doc p,.doc li{color:var(--tx);font-size:14px}
.doc ul,.doc ol{padding-left:22px}
.doc table{margin:9px 0}
.doc td,.doc th{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
.sig{color:var(--tx2);font-size:12px;margin-top:26px;text-align:center;line-height:1.9}

@media(max-width:600px){
  #top{gap:7px;padding:9px 0 8px}
  #brand{font-size:17px}
  #nav{gap:4px}
  #nav button{padding:6px 9px;font-size:13px;white-space:normal}
  .st{flex:1 1 calc(50% - 5px)}
}
html[data-motion="low"] *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="wrap">

<div id="top">
  <div id="brand">XianDial &middot; Station List Builder<small>XianForge　台单 → stations.tsv</small></div>
  <div class="sp"></div>
  <div id="topSeg">
    <button id="btnTheme" title="Toggle light / dark">◐ Theme</button>
    <button id="btnEn" title="Switch language">EN</button>
  </div>
</div>

<div id="nav"></div>
<div id="main"></div>

<div class="sig">
  <div id="sigLine">&copy; Lanlan Eternal</div>
</div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   XianDial &middot; Station List Builder  XianForge  v1.0
   格式契约：拾声硬件版-台源文件格式规格.md v1
   ══════════════════════════════════════════════════════════════ */

'use strict';

/* ───────── 常量：与固件 g_cat_name / g_prov_name 逐字一致 ───────── */
var CATS = ['新闻综合','交通台','音乐','文艺','说书','戏曲','怀旧老歌',
            '网络台','教育台','电视伴音','综合','宗教','境外新闻'];
var PROVS_CN = ['北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江',
                '安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川',
                '贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆'];
var PROVS_XW = ['中国台湾','中国香港','中国澳门','其他华语',
                '北美','欧洲','日韩','新马','东南亚','大洋洲','海外中文'];
var PROVS = PROVS_CN.concat(PROVS_XW);
var SPECIAL_PROV = ['全国','其他'];   /* → 固件 NET_PROV_NONE(255) */

var MAX_N    = 2000;    /* 固件 PSRAM Limit */
var MAX_NAME = 71;      /* UTF-8 bytes */
var MAX_URL  = 199;
var TARGET   = 'stations.tsv';

/* ───────── 全局状态 ───────── */
var S = {
  page:'conv',
  theme:'dark',
  lang:'zh',
  rows:[],        /* {name,url,cat,prov,err:[]} */
  srcName:'',
  enc:'',         /* 识别到的源Encoding */
  out:'',
  opt:{ dedup:true, guess:true, std:false, hash:true, wrapc:false }
};

var I18N = {
zh:{},
  en:{}
};

/* 页面清单 */
var PAGES = [
  {id:'conv',  t:{zh:'Convert',   en:'Convert'}},
  {id:'check', t:{zh:'Self-check',   en:'Self-check'}},
  {id:'use',   t:{zh:'How to use',   en:'How to use'}},
  {id:'faq',   t:{zh:'FAQ',   en:'FAQ'}},
  {id:'disc',  t:{zh:'Disclaimer',   en:'Disclaimer'}},
  {id:'about', t:{zh:'About',       en:'About'}}
];

function L(k){ var t=I18N[S.lang]; return (t&&t[k]!==undefined)?t[k]:I18N.zh[k]; }
function T(o){ return o ? (o[S.lang]||o.zh) : ''; }

/* ══════════ 1. Encoding识别与文本解码 ══════════
   ⚠️ 国内 M3U 大量是 GBK。不识别就是一整片乱码，
   而乱码Name会让分类推断全失效。 */
var utf8Dec = new TextDecoder('utf-8',{fatal:true});
function detectAndDecode(buf){
  var u8 = new Uint8Array(buf);
  /* BOM 优先 */
  if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)
    return {enc:'UTF-8 (BOM)', text:new TextDecoder('utf-8').decode(u8), bom:true};
  if(u8[0]===0xFF&&u8[1]===0xFE)
    return {enc:'UTF-16 LE', text:new TextDecoder('utf-16le').decode(u8), bom:true};
  if(u8[0]===0xFE&&u8[1]===0xFF)
    return {enc:'UTF-16 BE', text:new TextDecoder('utf-16be').decode(u8), bom:true};
  /* 严格 UTF-8？ */
  try{ return {enc:'UTF-8', text:utf8Dec.decode(u8), bom:false}; }catch(e){}
  /* 回落 GBK —— 宁可全角也不给乱码 */
  try{ return {enc:'GBK / GB2312', text:new TextDecoder('gbk').decode(u8), bom:false}; }
  catch(e){}
  return {enc:'未知', text:new TextDecoder('utf-8').decode(u8), bom:false, bad:true};
}

/* ══════════ 2. Parse ══════════
   支持：标准 M3U(#EXTINF)、Name,URL / Name URL / 纯 URL 一行、
        已是 stations.tsv（4 列 TAB)*/
var EXTINF = /^#EXTINF\s*:\s*(-?\d+)\s*(?:,)?\s*(.*)$/i;

/*★ 10-06修：从 #EXTINF 的参数串里正确取Name。
  国内 M3U 极常见这一行：
    #EXTINF:-1 tvg-id="" tvg-name="河南新闻广播" tvg-logo="....png" group-title="综合广播",河南新闻广播
  逗号【前】全是 tvg-* 属性，逗号【后】才是显示名。
  旧正则的 (.*)$ 把整串都当Name ⇒ 屏上会出现
    「tvg-id="" tvg-name="" tvg-logo="https://...」这种垃圾。
  规则（按可靠度排序)：
    ① tvg-name="..." 非空 → 用它
    ② 最后一个逗号之后的非空段→ 用它
    ③ 整串剥掉所有 key="value" 后剩下的非空 → 用它
  顺手也把 tvg-name 里的逗号处理掉（有些源用逗号Separator多个名)。*/
function extinfTitle(arg){
  var s = String(arg||'');
  /* ② 最后一个逗号之后 */
  var k = s.lastIndexOf(',');
  var tail = (k>=0 ? s.slice(k+1) : '').trim();
  if(tail) return tail;
  /* ① tvg-name */
  var m = s.match(/tvg-name\s*=\s*"([^"]*)"/i) || s.match(/tvg-name\s*=\s*'([^']*)'/i);
  if(m && m[1].trim()) return m[1].trim();
  /* ③ 剥掉所有 key="value" */
  var rest = s.replace(/\b[\w-]+\s*=\s*"[^"]*"/g,'')
             .replace(/\b[\w-]+\s*=\s*'[^']*'/g,'').trim();
  return rest;
}

function parseInput(text){
  var lines = String(text).replace(/\r\n?/g,'\n').split('\n');
  var out=[], pendingName=null, sawM3U=false;

  for(var i=0;i<lines.length;i++){
    var raw = lines[i];
    var s = raw.replace(/^﻿/,'').trim();
    if(!s) { pendingName=null; continue; }
    if(s.charAt(0)==='#'){
      var m = EXTINF.exec(s);
      /* ★ 用 extinfTitle 剥掉 tvg-* 属性，不能直接用 m[2] */
      if(m){ sawM3U=true; pendingName=extinfTitle(m[2])||null; }
      else if(/^#EXTVLCOPT|^#EXTGRP|^#PLAYLIST:/i.test(s)){ /* 忽略 */ }
      continue;                          /* 其它 # 指令忽略 */
    }

    var url = s, name = pendingName;
    pendingName = null;

    /* 已是 stations.tsv：4 列 TAB */
    var t = s.split('\t');
    if(t.length>=4 && /^https?:\/\//i.test(t[3].trim())){
      out.push({name:t[0].trim(), url:t[3].trim(), cat:t[1].trim(), prov:t[2].trim()});
      continue;
    }
    /* 一行两个字段 */
    if(!name){
      var sep = null;
      var mm = s.match(/^([^,]{1,80}?)\s*,\s*(https?:\/\/\S+)$/i);
      if(mm){ sep = 1; name = mm[1].trim(); url = mm[2].trim(); }
      if(!sep){
        mm = s.match(/^(\S.*?)\s+|\t\s+(https?:\/\/\S+)$/i);
        if(mm && /https?:\/\//i.test(mm[0]) && mm[0].indexOf(mm[0].match(/https?:\/\/\S+$/i)[0])>0){
          var u2 = mm[0].match(/https?:\/\/\S+$/i)[0];
          name = mm[0].slice(0, mm[0].length-u2.length).replace(/[,\t]+$/,'').trim();
          url = u2; sep = 1;
        }
      }
    }
    if(!/^https?:\/\//i.test(url)){
      var u3 = s.match(/https?:\/\/\S+/i);          /* 行尾别的东西后面粘着 URL */
      if(u3){ if(!name) name = s.replace(u3[0],'').trim(); url = u3[0]; }
      else continue;                                 /* 这行没有 URL，丢 */
    }
    out.push({name:(name||'').trim(), url:url.trim(), cat:'', prov:''});
  }
  return {rows:out, m3u:sawM3U};
}

/* ══════════ 3. 自动推断：Category + Region ══════════ */
var CAT_RULES = [
  ['戏曲',   /(戏曲|京剧|越剧|黄梅戏|评剧|豫剧|昆曲|秦腔|蒲剧|晋剧|川剧|粤剧|黄龙戏|采茶戏|花鼓戏|大戏|戏台|梨园| Theater|Opera)/i],
  ['说书',   /(评书|说书|相声|评话|故事会|曲艺|相声大会)/i],
  ['怀旧老歌',/(怀旧|老歌|老唱片|金曲|经典老歌|怀旧金曲|岁月|往事|民国|老年代|记忆中的)/i],
  ['宗教',   /(佛[教主光]?|基督教|福音|天主教|正教|新教|道观|道院|禅|法音|念佛|佛号|钟声|islam|quran|清真|寺钟)/i],
  ['电视伴音',/(电视|伴音|CCTV|央视|卫视|台标音)/i],
  ['交通台', /(交通|汽车|路况|飞驰|车友)/i],
  ['教育台', /(教育|教学|学校|人文|园丁)/i],
  ['境外新闻',/(国际新闻|国际台|国际广播电台|对外广播|国际在线|VOA|BBC|DW|Radio Free|RFI|环球|world news|China Radio International)/i],
  ['音乐',   /(音乐|调频|流行|摇滚|爵士|轻音乐|古典|金属|民谣|电音|音乐台|Music|Radio.*FM)/i],
  ['文艺',   /(文艺|艺术|综艺|娱乐|影视)/i],
  ['网络台', /(网络广播|网络台|互联网广播|在线广播|数字广播)/i],
  /* ★ 10-06 补：「XX人民广播电台」是【最常见的Name形态】。原来只列了
     「中央人民广播电台」一家，于是「北京人民广播电台」「西藏人民广播电台」
     全部落到兜底的「综合」—— 而「新闻综合」才是它们该去的Category。
     ⇒ 放宽成模式：任意前缀 + 人民广播电台。
     ⚠ 位置放在最后两条新闻规则【之前】：这样更具体的「中国之声」优先，
        泛化的「人民广播电台」兜底。若放到「电视伴音」之前会把
        「XX广播电视台」误判成新闻综合（它该是电视伴音)。*/
  ['新闻综合',/(人民广播电台|广播电视台)/i],
  ['新闻综合',/(新闻|时政|新闻综合|综合广播|资讯|头条|中央人民广播电台|中国之声|中华之声|神州之声|国际新闻台)/i]
];
function guessCat(name, url){
  var s = name + ' ' + (url||'');
  /* Region名误命中护栏：「花蓮」「佛山」不算宗教 */
  if(/(花蓮|花莲|莲花|莲花山|佛山|凭祥|蒙自|义乌|和田)/.test(name) && !/佛教|佛光|法音|禅/.test(s))
    s = s.replace(/(花蓮|花莲|莲花|莲花山|佛山|凭祥|蒙自|义乌|和田)/g,'　');
  for(var i=0;i<CAT_RULES.length;i++){
    if(CAT_RULES[i][1].test(s)) return CAT_RULES[i][0];
  }
  return '综合';
}

var PROV_ALIAS = {
  /* ⚠️ 绝对不要把「中央人民」「央广」「CNR」写进北京的别名——
     中央人民广播电台、中国之声是【全国台】，写进去会把全国台全判成北京。
     全国台的正确做法是让它落到空值 → 导出为「全国」。*/
  '北京':['北京','朝阳','海淀'],
  '天津':['天津'],'河北':['河北','石家庄','唐山','保定','廊坊','邯郸','沧州','秦皇岛'],

/* ⚠️ 长名优先匹配（插入顺序即优先级)：
   三门峡 必须排在 三门 之前、黑龙江 排在 龙江 之前。
   ★ 但也不能只靠长度——「吉林市」与「吉林」同长，必须让带「市/广播/电台」
     这类完整词的条目整体优先。用「长名 + 完整词」双重排序。 */
var PROV_KEYS = (function(){
  var arr=[];
  for(var p in PROV_ALIAS) PROV_ALIAS[p].forEach(function(k){
    if(k!==p) arr.push([p,k]);
  });
  arr.sort(function(a,b){
    var d = b[1].length - a[1].length;      /* 长名先 */
    if(d) return d;
    return a[0].localeCompare(b[0]);        /* 同长则按省名稳定排序 */
  });
  return arr;
})();
/* ★ 全国Name单：这些台不属于任何省级Region，必须返回空 → 导出为「全国」。
   判错的代价很直观：把中国之声显示成「北京台」，用户一眼就看出错了。*/
var NATIONAL_HINT = /(中央人民|中国之声|中华之声|神州之声|央广|中央广播|中央电视|央视|CCTV|中国教育|中国交通广播|国家广播|国际新闻台|环球广播|中国之声|中央人民广播电台)/;
function guessProv(name){
  if(NATIONAL_HINT.test(name)) return '';
  var s = name;
  for(var i=0;i<PROV_KEYS.length;i++){
    if(s.indexOf(PROV_KEYS[i][1])>=0) return PROV_KEYS[i][0];
  }
  for(var p in PROV_ALIAS){                       /* 省级名本身 */
    if(s.indexOf(p)>=0) return p;
  }
  return '';
}

/* ══════════ 4. 规范化 + 校验 ══════════ */
function utf8len(s){ return new TextEncoder().encode(String(s)).length; }
function hasCtrl(s){ return /[\x00-\x08\x0B\x0C\x0E-\x1F]/.test(s); }

function normalize(){
  var seenU={}, seenN={}, keep=[];
  S.rows.forEach(function(r){
    var e=[];
    r.cat  = String(r.cat||'').trim();
    r.prov = String(r.prov||'').trim();
    r.name = String(r.name||'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').trim();
    r.url  = String(r.url||'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').trim();

    if(!r.name){
      /* 没Name：用域名+末段文件名兜底，别留空行 */
      var m = r.url.match(/^https?:\/\/([^\/]+)(?:\/(.*))?$/i);
      var host = m?m[1]:'未知';
      var tail = (m&&m[2])? m[2].split(/[\/\?#]/).pop() : '';
      r.name = tail.replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[_\-\+]/g,' ').trim();
      if(!r.name) r.name = host;
      e.push('auto-name');
    }
    if(utf8len(r.name) > MAX_NAME) e.push('name-long');
    if(/[\t]/.test(r.name)) e.push('name-tab');
    if(hasCtrl(r.name)) e.push('name-ctrl');
    if(!/^https?:\/\//i.test(r.url)) e.push('url-bad');
    if(utf8len(r.url) > MAX_URL) e.push('url-long');
    if(CATS.indexOf(r.cat)<0)   { if(r.cat) e.push('cat-unknown'); r.cat = r.cat||'综合'; }
    if(PROVS.indexOf(r.prov)<0 && SPECIAL_PROV.indexOf(r.prov)<0){
      if(r.prov) e.push('prov-unknown'); r.prov = r.prov||'';
    }
    if(S.opt.dedup){
      if(seenU[r.url]!==undefined)  { e.push('dup-url'); }
      if(seenN[r.name]!==undefined){ e.push('dup-name'); }
    }
    r.err = e;
    if(!e.length || e.indexOf('auto-name')<0 || e.length===1){
      seenU[r.url]=1; seenN[r.name]=1;
    }
    keep.push(r);
  });

  /* 纯重复的直接丢，只留提示 */
  S.rows = S.opt.dedup
    ? keep.filter(function(r){ return r.err.indexOf('dup-url')<0 && r.err.indexOf('dup-name')<0; })
    : keep;
}

/* ══════════ 5. 生成 TSV（★ no BOM / 强制 LF / 单 TAB) ══════════ */
function buildTsv(){
  var out = [];
  /* ★ 10-06：原来这里写 4 行说明性Comments。改成【只留一行】Flags。
     理由：数据文件混进说明文字，使用者手工编辑时容易误改；
     而固件读取器本来就跳过 # 开头行，留一行足够标识格式。
     详细格式见《台源文件格式规格.md》与随包的 README。*/
  out.push('# XianDial stations.tsv &mdash; ' + S.rows.length + ' stations');
  S.rows.forEach(function(r){
    var name = r.name.replace(/[\t\n]/g,' ');
    var cat  = CATS.indexOf(r.cat)>=0 ? r.cat : '综合';
    var prov = (PROVS.indexOf(r.prov)>=0) ? r.prov
             : (SPECIAL_PROV.indexOf(r.prov)>=0 ? r.prov : '其他');
    out.push(name + '\t' + cat + '\t' + prov + '\t' + r.url);
  });
  return out.join('\n');      /* ⚠️ 只用 \n，绝不 \r\n */
}

/* ══════════ 6. 自检清单 ══════════ */
function selfCheck(){
  var r=[], hard=[], soft=[];
  var n = S.rows.length;

  if(!n){ r.push(['warn','No stations parsed yet. Paste or drop an M3U / plain-text list above.']); return r; }

  /* names */
  var badName=S.rows.filter(function(x){return x.err.indexOf('name-long')>=0||x.err.indexOf('name-tab')>=0;});
  if(badName.length) hard.push('There <code>'+badName.length+'</code> rows have a name over '+MAX_NAME+' bytes or containing a TAB &mdash; those rows export corrupted and the firmware cannot read them.');

  /* URL */
  var badUrl=S.rows.filter(function(x){return x.err.indexOf('url-bad')>=0;});
  var longUrl=S.rows.filter(function(x){return x.err.indexOf('url-long')>=0;});
  if(badUrl.length) hard.push('There <code>'+badUrl.length+'</code> rows have a URL that does not start with http/https. They were kept &mdash; please check them.');
  if(longUrl.length) hard.push('There <code>'+longUrl.length+'</code> rows have a URL over '+MAX_URL+' bytes, exceeding the firmware field limit.');

  /* unknown category / region */
  var badCat=S.rows.filter(function(x){return x.err.indexOf('cat-unknown')>=0;});
  var badProv=S.rows.filter(function(x){return x.err.indexOf('prov-unknown')>=0;});
  if(badCat.length) hard.push('There <code>'+badCat.length+'</code> rows use a category that is not one of the 13 standard values; the firmware will fall back to the default.');
  if(badProv.length) hard.push('There <code>'+badProv.length+'</code> rows use a region that is not one of the 42 standard values; the firmware will fall back to the default.');

  /* count */
  if(n>MAX_N) hard.push('Parsed <code>'+n+'</code> stations, over the firmware limit of <code>'+MAX_N+'</code> stations. The import will be rejected.');
  else if(n>MAX_N*0.8) soft.push('You already have <code>'+n+'</code> stations, close to the limit of '+MAX_N+' stations.');

  /* protocol mix */
  var hls=S.rows.filter(function(x){return /\.m3u8(\?|$)/i.test(x.url);}).length;
  var http=S.rows.filter(function(x){return /^http:/i.test(x.url);}).length;
  var https=S.rows.length-http;
  soft.push('Protocol mix: <code>http '+http+'</code> / <code>https '+https+'</code>, of which <code>HLS(m3u8) '+hls+'</code>.');
  if(hls) soft.push('HLS stations do play on the XianDial firmware, but they cost more bandwidth and memory. <b>Verify one yourself</b> before relying on it.');

  /* suspicious URLs */
  var q = S.rows.filter(function(x){return /\?wsSession=|&wsIPSercert=|token=|sessionid=/i.test(x.url);});
  if(q.length) soft.push('There <code>'+q.length+'</code> URLs carry signed parameters (wsSession and friends). <b>These links expire</b> &mdash; they are one-shot sources.');
  var demo = S.rows.filter(function(x){return /example\.com|localhost|127\.0\.0\.1|test\.|\/test$|your[-_]?url/i.test(x.url);});
  if(demo.length) soft.push('There <code>'+demo.length+'</code> URLs look like examples or local addresses; they will not play once imported.');

  /* font coverage note */
  soft.push('If an imported name contains rare characters, the UI may show a box glyph. This depends on whether the station-name font in the firmware covers the GB2312 level-1 set.');

  if(!hard.length) r.push(['pass','All hard checks passed: ' + n + ' stations &mdash; names, URLs, categories and regions are all within limits.']);
  hard.forEach(function(h){ r.push(['err',h]); });
  soft.forEach(function(s){ r.push(['warn',s]); });
  return r;
}

/* ══════════ 7. 渲染 ══════════ */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

  h += '<h3>Specification at a glance</h3><table><tbody><tr><th>Path</th><td>/sdcard/'+TARGET+' (card root)</td></tr><tr><th>Encoding</th><td>UTF-8，<b>no BOM</b></td></tr><tr><th>Line endings</th><td>LF（\\n)，<b>must not be CRLF</b></td></tr><tr><th>Separator</th><td>TAB, exactly one</td></tr><tr><th>Column order</th><td>Name &middot; Category &middot; Region &middot; URL</td></tr><tr><th>Limit</th><td>'+MAX_N+' stations</td></tr><tr><th>Max name length</th><td>'+MAX_NAME+' bytes (UTF-8)</td></tr><tr><th>Max URL length</th><td>'+MAX_URL+' bytes</td></tr><tr><th>Comments</th><td>Lines starting with <code>#</code> are skipped entirely; blank lines are skipped</td></tr><tr><th>Category</th><td>13 standard values; anything else falls back to the default</td></tr><tr><th>Region</th><td>42 standard values, or the nationwide/other markers &rarr; no specific region</td></tr></tbody></table>';
  h += '</div>';
  return h;
}

function refresh(){
  if(S.opt.guess){
    S.rows.forEach(function(r){
      if(!r.cat) r.cat = guessCat(r.name, r.url);
      if(!r.prov) r.prov = guessProv(r.name) || '全国';
    });
  }
  normalize();
  S.out = buildTsv();
  render();
}

/* ══════════ 9. 事件 ══════════ */
function bindConv(){
  var drop = document.getElementById('drop');
  var file = document.getElementById('file');
  var ta   = document.getElementById('ta');
  if(!drop) return;

  drop.addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(e){
    readFiles(Array.prototype.slice.call(e.target.files||[]));
  });
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('hot'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('hot'); });
  });
  drop.addEventListener('drop', function(e){
    var fs = e.dataTransfer && e.dataTransfer.files
           ? Array.prototype.slice.call(e.dataTransfer.files) : [];
    readFiles(fs);
  });

  var bp = document.getElementById('btnParse');
  if(bp) bp.addEventListener('click', function(){
    ingestText(ta.value, '手工粘贴');
  });
  var bs = document.getElementById('btnSample');
  if(bs) bs.addEventListener('click', function(){
    ingestText(SAMPLE_M3U, '内置示例');
  });
  var bc = document.getElementById('btnClear');
  if(bc) bc.addEventListener('click', function(){
    S.rows=[]; S.out=''; S.srcName=''; S.enc=''; render();
  });

  var catC = document.getElementById('catChips');
  if(catC) catC.addEventListener('click', function(e){
    var c = e.target.getAttribute && e.target.getAttribute('data-cat');
    if(c===null || c===undefined) return;
    var on = e.target.classList.contains('on');
    Array.prototype.forEach.call(catC.children, function(x){ x.classList.remove('on'); });
    if(on) return;
    e.target.classList.add('on');
    S.rows.forEach(function(r){ r.cat = c; });
    normalize(); S.out = buildTsv(); render();
  });
  var prC = document.getElementById('provChips');
  if(prC) prC.addEventListener('click', function(e){
    var p = e.target.getAttribute && e.target.getAttribute('data-prov');
    if(p===null || p===undefined) return;
    var on = e.target.classList.contains('on');
    Array.prototype.forEach.call(prC.children, function(x){ x.classList.remove('on'); });
    if(on) return;
    e.target.classList.add('on');
    S.rows.forEach(function(r){ r.prov = p; });
    normalize(); S.out = buildTsv(); render();
  });

  /* 逐格编辑：改值后不重渲染，避免打断输入 */
  document.getElementById('main').addEventListener('input', function(e){
    var t = e.target;
    if(!t.classList || !t.classList.contains('cel')) return;
    var i = +t.getAttribute('data-i'), f = t.getAttribute('data-f');
    if(!S.rows[i]) return;
    S.rows[i][f] = t.value;
    var r = S.rows[i];
    var tags=[];
    if(utf8len(r.name)>MAX_NAME) tags.push('name too long');
    if(!/^https?:\/\//i.test(r.url)) tags.push('URL非法');
    if(utf8len(r.url)>MAX_URL) tags.push('URLtoo long');
    var cell = t.parentNode.nextSibling.nextSibling;
    if(cell && cell.classList && cell.classList.contains('s')){
      cell.innerHTML = tags.map(function(x){ return '<span class="tag x">'+x+'</span>'; }).join(' ');
    }
    S.out = buildTsv();
  });
  document.getElementById('main').addEventListener('change', function(e){
    var t = e.target;
    if(t.tagName && t.tagName.toLowerCase()==='select'){
      var i = +t.getAttribute('data-i'), f = t.getAttribute('data-f');
      if(!S.rows[i]) return;
      S.rows[i][f] = t.value;
      normalize(); S.out = buildTsv();
    }
  });

  var od = document.getElementById('optDedup');
  if(od) od.addEventListener('change', function(){ S.opt.dedup = od.checked; refresh(); });
  var og = document.getElementById('optGuess');
  if(og) og.addEventListener('change', function(){ S.opt.guess = og.checked; refresh(); });

  var bd = document.getElementById('btnDl');
  if(bd) bd.addEventListener('click', function(){
    download(TARGET, S.out || buildTsv());
  });
  var bcpy = document.getElementById('btnCopy');
  if(bcpy) bcpy.addEventListener('click', function(){
    var txt = S.out || buildTsv();
    if(!txt) return;
    var ta2 = document.createElement('textarea');
    ta2.value = txt; ta2.style.position='fixed'; ta2.style.left='-9999px';
    document.body.appendChild(ta2); ta2.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta2);
    alert(ok ? 'Copied to clipboard.\n\n⚠️  When pasting into Notepad and saving as UTF-8,  choose <b>no BOM</b> and <b>LF</b> line endings &mdash; otherwise the firmware cannot read the file.'
            : 'Copy failed. Please use the &ldquo;Download&rdquo; button instead.');
  });
  var be = document.getElementById('btnEx');
  if(be) be.addEventListener('click', function(){
    download('stations.example.tsv', buildExample());
  });
}

function readFiles(fs){
  if(!fs.length) return;
  var names=[], done=0, merged=[];
  fs.forEach(function(f){
    var r = new FileReader();
    r.onload = function(){
      var d = detectAndDecode(r.result);
      names.push(f.name);
      S.enc = d.enc;
      var p = parseInput(d.text);
      merged = merged.concat(p.rows);
      done++;
      if(done===fs.length){
        S.srcName = names.join(' + ');
        S.rows = merged;
        refresh();
      }
    };
    r.onerror = function(){
      done++;
      if(done===fs.length){ S.srcName = names.join(' + '); S.rows = merged; refresh(); }
    };
    r.readAsArrayBuffer(f);
  });
}

function ingestText(text, src){
  if(!String(text).trim()) { alert('The content is empty.'); return; }
  var p = parseInput(text);
  S.srcName = src;
  S.enc = '';
  S.rows = p.rows;
  refresh();
  if(!S.rows.length) alert('No stations parsed.\n\nPlease make sure the content contains addresses starting with http:// or https://.');
}

function download(name, text){
  /* ⚠️ Blob 里手工去掉 BOM，保证下载到的文件零 BOM */
  var data = text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
  var blob = new Blob([data], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}
